name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-api
    steps:
      - name: Pull code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            notes-api/*.gradle*
            notes-api/gradle/wrapper/gradle-wrapper.properties

      - name: Lint (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Unit tests
        run: ./gradlew test

      - name: Build Docker image
        run: docker build -t notes-api:ci .
