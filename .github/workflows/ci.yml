name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-api
    steps:
      - name: Pull code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            notes-api/*.gradle*
            notes-api/gradle/wrapper/gradle-wrapper.properties

      - name: Lint (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Unit tests
        run: ./gradlew test

      - name: Build Docker image
        run: docker build -t notes-api:ci .
      - name: Job summary
        if: always()
        run: |
          TESTS=$(cat build/test-results/test/*.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          FAILS=$(cat build/test-results/test/*.xml 2>/dev/null | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          {
            echo "## CI summary"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Tests run: ${TESTS}, failures: ${FAILS}"
            echo "- Docker image size: $(docker images notes-api:ci --format '{{.Size}}')"
          } >> "$GITHUB_STEP_SUMMARY"
